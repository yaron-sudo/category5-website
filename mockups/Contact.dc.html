<x-dc>
<helmet>

<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0">יש לכם שאלה? אנחנו כאן.</h1>
<p style="margin: 0">השאירו פרטים ונחזור אליכם בהקדם.</p>
<p style="margin: 0"><span dir="ltr">WhatsApp: 053-9325888</span><br>הודעות בלבד</p>
<p style="margin: 0">מייל: <a href="mailto:info@ethical-supplements.com" dir="ltr" style="color: #141414">info@ethical-supplements.com</a></p>

<form style="flex: 1 1 420px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<label class="c5-label">שם מלא<input class="c5-input" type="text"></label>

<label class="c5-label">נושא הפנייה

<label class="c5-label c5-full">הודעה<textarea class="c5-input" rows="6" style="padding: 12px; resize: vertical; min-height: 140px"></textarea></label>
<button type="button" style="justify-self: start; min-height: 44px; padding: 0 22px; border: 1px solid #141414; border-radius: 4px; background: #ffffff; color: #141414; font: inherit; cursor: pointer">שליחה</button>

</section>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
<dc-import name="Floating" hint-size="0px,0px"></dc-import>
