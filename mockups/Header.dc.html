</div>

<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["none","series","needs","mobile"],"default":"none"},"scrolled":{"editor":"boolean","default":false},"compact":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const d = props.demo || 'none';
    this.state = { open: (d === 'series' || d === 'needs') ? d : null, mobileOpen: d === 'mobile', w: (typeof window !== 'undefined' ? window.innerWidth : 1440), y: 0, hidden: false, hover: false };
    this.lastY = 0;
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const dy = y - this.lastY;
      let hidden = this.state.hidden;
      if (y < 80) hidden = false;
      else if (dy > 6) hidden = true;
      else if (dy < -6) hidden = false;
      this.lastY = y;
      if (hidden !== this.state.hidden) this.setState({ y: y, hidden: hidden, open: null, mobileOpen: false }); else this.setState({ y: y });
    };
    this.onDocClick = (e) => {
      if (!this.state.open && !this.state.mobileOpen) return;
      const el = e.target && e.target.closest ? e.target.closest('.c5-header') : null;
      if (!el) this.setState({ open: null, mobileOpen: false });
    };
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ open: null, mobileOpen: false }); };
  }
  componentDidMount() {
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('click', this.onDocClick);
    document.addEventListener('keydown', this.onKey);
    this.onResize(); this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('click', this.onDocClick);
    document.removeEventListener('keydown', this.onKey);
  }
  componentDidUpdate(prev) {
    if (prev.demo !== this.props.demo) {
      const d = this.props.demo || 'none';
      this.setState({ open: (d === 'series' || d === 'needs') ? d : null, mobileOpen: d === 'mobile' });
    }
  }
  renderVals() {
    const narrow = this.state.w < 1000;
    const open = this.state.open;
    const scrolled = !!this.props.scrolled || this.state.y > 40;
    const compact = (!!this.props.compact || this.state.hidden) && !this.state.hover && !open && !this.state.mobileOpen;
    const bar = compact
      ? { h: '44px', logo: '26px', shadow: '0 6px 20px rgba(0,0,0,0.05)', cls: 'c5-compact' }
      : (scrolled ? { h: '64px', logo: '34px', shadow: '0 8px 24px rgba(0,0,0,0.06)', cls: '' } : { h: '80px', logo: '40px', shadow: 'none', cls: '' });
    const closeAll = () => this.setState({ open: null, mobileOpen: false });
    return {
      bar: bar,
      hoverOn: () => this.setState({ hover: true }),
      hoverOff: () => this.setState({ hover: false }),
      wide: !narrow,
      narrow: narrow,
      seriesOpen: !narrow && open === 'series',
      needsOpen: !narrow && open === 'needs',
      mobileOpen: narrow && this.state.mobileOpen,
      closeAll: closeAll,
      toggleSeries: () => this.setState({ open: open === 'series' ? null : 'series' }),
      toggleNeeds: () => this.setState({ open: open === 'needs' ? null : 'needs' }),
      toggleMobile: () => this.setState({ mobileOpen: !this.state.mobileOpen }),
      needs: [{ label: 'חורף בריא' }, { label: 'נשים' }, { label: 'גברים' }, { label: 'ספורט ותנועה' }, { label: 'ילדים' }, { label: 'הגיל השלישי' }]
    };
  }
}
</script>
