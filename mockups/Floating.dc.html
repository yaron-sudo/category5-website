<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>צ'אט AI ונגישות – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; color: #141414; font-size: 15px; line-height: 1.5">

<button type="button" aria-label="נגישות" style="position: fixed; right: 20px; bottom: 20px; z-index: 80; width: 48px; height: 48px; border-radius: 4px; border: 1px solid #141414; background: #ffffff; color: #141414; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8" fill="currentColor"></circle><path d="M5 8.5l7 1.5 7-1.5M12 10v4.5M12 14.5l-3.5 6M12 14.5l3.5 6"></path></svg></button>

<sc-if value="{{closed}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{toggle}}" style="position: fixed; left: 20px; bottom: 20px; z-index: 80; min-height: 48px; padding: 0 22px; border-radius: 4px; border: 1px solid #141414; background: #ffffff; color: #141414; font: inherit; font-size: 16px; cursor: pointer">דברו איתנו</button>
</sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-label="דברו איתנו" style="position: fixed; left: 16px; bottom: 16px; z-index: 90; width: min(380px, calc(100vw - 32px)); height: min(600px, calc(100vh - 32px)); background: #ffffff; border: 1px solid #141414; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #dcdcd9">
<p style="margin: 0; flex: 1 1 auto; font-size: 17px">דברו איתנו</p>
<div role="group" aria-label="שפה" style="display: flex; gap: 4px">
<button type="button" aria-pressed="true" style="min-width: 40px; min-height: 32px; border: 1px solid #141414; border-radius: 4px; background: #141414; color: #ffffff; font: inherit; font-size: 13px">עב</button>
<button type="button" aria-pressed="false" lang="en" style="min-width: 40px; min-height: 32px; border: 1px solid #141414; border-radius: 4px; background: #ffffff; color: #141414; font: inherit; font-size: 13px">EN</button>
</div>
<button type="button" onClick="{{toggle}}" aria-label="סגירה" style="width: 40px; height: 40px; border: 0; background: transparent; color: #141414; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #f7f7f5">
<div style="align-self: flex-start; max-width: 85%; background: #ffffff; border: 1px solid #dcdcd9; padding: 10px 14px; border-radius: 4px">הודעת פתיחה</div>
<div style="align-self: flex-end; max-width: 85%; background: #ffffff; border: 1px solid #141414; padding: 10px 14px; border-radius: 4px">שאלה</div>
<div style="align-self: flex-start; max-width: 90%; background: #ffffff; border: 1px solid #dcdcd9; padding: 10px 14px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px">
<span>תשובה עם המלצה</span>
<a href="Product.dc.html" style="color: #141414">לינק לעמוד המוצר</a>
<a href="Stores.dc.html" style="color: #141414">לינק לרכישה</a>
</div>
</div>
<form style="border-top: 1px solid #dcdcd9; padding: 10px; display: flex; gap: 8px; align-items: center">
<label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">הקלידו שאלה</label>
<input id="chat-input" type="text" placeholder="כתבו שאלה…" style="flex: 1 1 auto; min-width: 0; min-height: 44px; border: 1px solid #141414; border-radius: 4px; padding: 0 12px; font: inherit">
<button type="button" aria-label="שליחה" style="width: 44px; height: 44px; border: 1px solid #141414; border-radius: 4px; background: #ffffff; color: #141414; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></button>
</form>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":false},"$preview":{"width":480,"height":760}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: !!props.startOpen }; }
  componentDidUpdate(prev) { if (prev.startOpen !== this.props.startOpen) this.setState({ open: !!this.props.startOpen }); }
  renderVals() { return { open: this.state.open, closed: !this.state.open, toggle: () => this.setState({ open: !this.state.open }) }; }
}
</script>
</body>
</html>
