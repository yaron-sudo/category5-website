<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אריח סדרה – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<a href="{{s.href}}" dir="rtl" style="display: flex; flex-direction: column; align-items: center; gap: 20px; height: 100%; padding: 24px 12px; text-decoration: none; color: #141414; font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; box-sizing: border-box; text-align: center">
<span style="width: 96px; height: 96px; display: flex; align-items: center; justify-content: center">
<img src="{{s.icon}}" alt="" style="width: 96px; height: 96px">
</span>
<span style="font-size: 20px; line-height: 1.3">{{s.name}}</span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"series":{"editor":"enum","options":["vit","plants","probio","pro"],"default":"vit"},"$preview":{"width":320,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.series ?? 'vit';
    const all = {
      vit: { name: 'ויטמינים ומינרלים', color: '#003e21', icon: '../assets/icons/series-vitamins-minerals.svg', href: 'Series.dc.html' },
      plants: { name: 'צמחים', color: '#d5a425', icon: '../assets/icons/series-plants.svg', href: 'Series-plants.dc.html' },
      probio: { name: 'פרוביוטיקה', color: '#85bbe6', icon: '../assets/icons/series-probiotics.svg', href: 'Series-probio.dc.html' },
      pro: { name: 'הסדרה המקצועית', color: '#4d0333', icon: '../assets/icons/series-professional.svg', href: 'Series-pro.dc.html' }
    };
    return { s: all[k] || all.vit };
  }
}
</script>
</body>
</html>
