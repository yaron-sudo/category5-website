<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כרטיס מוצר – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<a href="{{href}}" dir="rtl" style="display: flex; flex-direction: column; height: 100%; text-decoration: none; color: #141414; font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; background: #ffffff; border: 1px solid #dcdcd9; box-sizing: border-box">
<div style="aspect-ratio: 1 / 1; background: #f7f7f5; display: flex; align-items: center; justify-content: center; overflow: hidden">
<sc-if value="{{hasImage}}" hint-placeholder-val="{{ true }}"><img src="{{image}}" alt="{{title}}" style="width: 100%; height: 100%; object-fit: contain"></sc-if>
<sc-if value="{{noImage}}" hint-placeholder-val="{{ false }}"><span>אימג׳</span></sc-if>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 14px; height: 14px; background: {{s.color}}; display: inline-block"></span>{{s.name}}</span>
<span style="font-size: 20px; line-height: 1.3">{{title}}</span>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"שם מוצר"},"image":{"editor":"text","default":""},"series":{"editor":"enum","options":["vit","plants","probio","pro"],"default":"vit"},"href":{"editor":"text","default":"Product.dc.html"},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const all = {
      vit: { name: 'ויטמינים ומינרלים', color: '#003e21' },
      plants: { name: 'צמחים', color: '#d5a425' },
      probio: { name: 'פרוביוטיקה', color: '#85bbe6' },
      pro: { name: 'הסדרה המקצועית', color: '#4d0333' }
    };
    const image = this.props.image || '';
    return {
      href: this.props.href || 'Product.dc.html',
      title: this.props.title || 'שם מוצר',
      image: image, hasImage: !!image, noImage: !image,
      s: all[this.props.series ?? 'vit'] || all.vit
    };
  }
}
</script>
</body>
</html>
