<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עמוד סדרה – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; color: #141414; background: #ffffff; min-height: 100vh; font-size: 17px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<dc-import name="Header" hint-size="100%,80px"></dc-import>
</div>

<main>
<section aria-label="באנר">
<img src="{{s.banner}}" alt="{{s.name}}" style="display: block; width: 100%; height: auto">
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 5vw, 72px) clamp(16px, 4vw, 48px) 24px; box-sizing: border-box">
<p style="margin: 0; max-width: 820px">פירוט קצר על הסדרה</p>
</section>

<section aria-label="מוצרי הסדרה" style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) clamp(56px, 7vw, 112px); box-sizing: border-box">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<dc-import name="ProductCard" title="{{p.title}}" image="{{p.image}}" href="{{p.href}}" series="{{seriesKey}}" hint-size="100%,400px"></dc-import>
</sc-for>
</div>
</section>
</main>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
<dc-import name="Floating" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"series":{"editor":"enum","options":["vit","plants","probio","pro"],"default":"vit"},"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.series ?? 'vit';
    const all = {
      vit: { name: 'ויטמינים ומינרלים', banner: '../assets/banners/series-vitamins-minerals.jpg', first: { title: 'מגנזיום ביסגליצינאט ליפוזומלי', image: '../assets/products/magnesium-bisglycinate-liposomal.jpg', href: 'Product.dc.html' } },
      plants: { name: 'צמחים', banner: '../assets/banners/series-plants.jpg', first: { title: 'קומפלקס כורכומין', image: '../assets/products/curcumin-complex.jpg', href: 'Product.dc.html' } },
      probio: { name: 'פרוביוטיקה', banner: '../assets/banners/series-probiotics.jpg', first: { title: 'פוסטביוטיקה', image: '../assets/products/postbiotic.jpg', href: 'Product.dc.html' } },
      pro: { name: 'הסדרה המקצועית', banner: '../assets/banners/series-professional.jpg', first: { title: 'רויוואל', image: '../assets/products/revival.jpg', href: 'Product.dc.html' },
        second: { title: 'קלצידקס', image: '../assets/products/calcidex.png', href: 'Product-Pro.dc.html' } }
    };
    const s = all[k] || all.vit;
    const ph = { title: 'שם מוצר', image: '', href: 'Product.dc.html' };
    return { seriesKey: k, s: s, products: [s.first, s.second || ph, ph, ph, ph, ph] };
  }
}
</script>
</body>
</html>
