<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מאמרים מקצועיים – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; color: #141414; background: #ffffff; min-height: 100vh; font-size: 17px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<dc-import name="Header" hint-size="100%,80px"></dc-import>
</div>

<main>
<section style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 6vw, 88px) clamp(16px, 4vw, 48px) 24px; box-sizing: border-box">
<h1 style="margin: 0">מאמרים מקצועיים</h1>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) clamp(56px, 7vw, 112px); box-sizing: border-box">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px 28px">
<sc-for list="{{articles}}" as="a" hint-placeholder-count="6">
<article style="display: flex; flex-direction: column; gap: 12px">
<div style="aspect-ratio: 4 / 3; background: #e9e9e7; display: flex; align-items: center; justify-content: center">אימג׳</div>
<h3 style="margin: 0">כותרת</h3>
<p style="margin: 0">טקסט תקציר</p>
<a href="Article.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border: 1px solid #141414; border-radius: 4px; color: #141414; text-decoration: none">קרא עוד</a>
</article>
</sc-for>
</div>
</section>
</main>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
<dc-import name="Floating" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() { return { articles: [1, 2, 3, 4, 5, 6].map((n) => ({ n: n })) }; }
}
</script>
</body>
</html>
