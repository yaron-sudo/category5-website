<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עמוד תחום – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; color: #141414; background: #ffffff; min-height: 100vh; font-size: 17px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<dc-import name="Header" hint-size="100%,80px"></dc-import>
</div>

<main>
<section aria-label="באנר" style="background: #e9e9e7; min-height: clamp(260px, 30vw, 480px); display: flex; align-items: center; justify-content: center; position: relative">
<p style="margin: 0; font-size: 20px">באנר</p>
<h1 class="c5-banner-title" style="position: absolute; left: clamp(16px, 4vw, 64px); bottom: clamp(24px, 4vw, 48px); margin: 0; color: #141414">{{needName}}</h1>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 5vw, 72px) clamp(16px, 4vw, 48px) 24px; box-sizing: border-box">
<p style="margin: 0; max-width: 820px">פירוט קצר על התחום</p>
</section>

<section aria-label="מוצרים בתחום" style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) clamp(56px, 7vw, 112px); box-sizing: border-box">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px">
<dc-import name="ProductCard" title="מגנזיום ביסגליצינאט ליפוזומלי" image="../assets/products/magnesium-bisglycinate-liposomal.jpg" series="vit" hint-size="100%,400px"></dc-import>
<dc-import name="ProductCard" title="רויוואל" image="../assets/products/revival.jpg" series="pro" hint-size="100%,400px"></dc-import>
<dc-import name="ProductCard" title="פוסטביוטיקה" image="../assets/products/postbiotic.jpg" series="probio" hint-size="100%,400px"></dc-import>
<dc-import name="ProductCard" title="קומפלקס כורכומין" image="../assets/products/curcumin-complex.jpg" series="plants" hint-size="100%,400px"></dc-import>
</div>
</section>
</main>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
<dc-import name="Floating" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"need":{"editor":"enum","options":["חורף בריא","נשים","גברים","ספורט ותנועה","ילדים","הגיל השלישי"],"default":"חורף בריא"},"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() { return { needName: this.props.need ?? 'חורף בריא' }; }
}
</script>
</body>
</html>
