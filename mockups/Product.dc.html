<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עמוד מוצר – Category 5</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/category5/tokens.css">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Regular.ttf);font-weight:400}
@font-face{font-family:"C5 Sans";src:url(../assets/fonts/NotoSansHebrew-Bold.ttf);font-weight:700}
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="font-family: 'C5 Sans', 'Noto Sans Hebrew', Arial, sans-serif; color: #141414; background: #ffffff; min-height: 100vh; font-size: 17px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<dc-import name="Header" hint-size="100%,80px"></dc-import>
</div>

<main>
<section aria-label="באנר מוצר" style="background: #f7f7f5">
<div style="max-width: 1280px; margin: 0 auto; padding: clamp(24px, 4vw, 56px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(24px, 4vw, 64px); box-sizing: border-box">
<div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0">{{productName}}</h1>
<a href="{{s.href}}" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: #141414; align-self: flex-start">
<span style="width: 44px; height: 44px; background: {{s.color}}; display: flex; align-items: center; justify-content: center">
<img src="{{s.icon}}" alt="" style="width: 32px; height: 32px">
</span>
<span>{{s.name}}</span></a>
</div>
<div style="flex: 1 1 380px; display: flex; justify-content: center">
<img src="{{productImage}}" alt="{{productName}}" style="display: block; width: 100%; max-width: 600px; height: auto">
</div>
</div>
</section>

<section aria-label="על המוצר" style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 5vw, 72px) clamp(16px, 4vw, 48px) 0; box-sizing: border-box">
<p style="margin: 0; max-width: 820px">פסקה קצרה על המוצר</p>
</section>

<section aria-label="מידע מרכזי" style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 5vw, 64px) clamp(16px, 4vw, 48px); box-sizing: border-box">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; border-top: 1px solid #141414; padding-top: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0">מכיל X קפסולות</h3>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0">המלצות שימוש</h3>
<ul style="margin: 0; padding-inline-start: 20px"><li>טקסט מהאתר הקיים</li></ul>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0">יתרונות המוצר ושימושים</h3>
<ul style="margin: 0; padding-inline-start: 20px"><li>טקסט מהאתר הקיים</li></ul>
</div>
</div>
</section>

<section aria-label="חנויות" style="background: #f7f7f5">
<div style="max-width: 1280px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 48px); box-sizing: border-box">
<p style="margin: 0"><a href="Stores.dc.html" style="color: #141414">מחפשים אותנו? מצאו את החנויות הקרובות אליכם.</a></p>
</div>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 5vw, 72px) clamp(16px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: clamp(32px, 4vw, 64px); align-items: flex-start">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0">תווית המוצר</h3>
<div style="aspect-ratio: 4 / 3; background: #e9e9e7; display: flex; align-items: center; justify-content: center">אימג׳</div>
</div>
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0">פרטים נוספים</h3>
<p style="margin: 0">הטקסט המופיע כיום בתחתית עמוד המוצר</p>
</div>
</section>

<section aria-label="התוויה משפטית" style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) clamp(48px, 6vw, 88px); box-sizing: border-box">
<p style="margin: 0; font-size: 15px">התוויה משפטית</p>
</section>
</main>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
<dc-import name="Floating" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"series":{"editor":"enum","options":["vit","plants","probio","pro"],"default":"vit"},"product":{"editor":"text","default":""},"image":{"editor":"text","default":""},"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.series ?? 'vit';
    const all = {
      vit: { name: 'ויטמינים ומינרלים', color: '#003e21', icon: '../assets/icons/series-vitamins-minerals-white.svg', href: 'Series.dc.html', product: 'מגנזיום ביסגליצינאט ליפוזומלי', image: '../assets/products/magnesium-bisglycinate-liposomal.jpg' },
      plants: { name: 'צמחים', color: '#d5a425', icon: '../assets/icons/series-plants-white.svg', href: 'Series-plants.dc.html', product: 'קומפלקס כורכומין', image: '../assets/products/curcumin-complex.jpg' },
      probio: { name: 'פרוביוטיקה', color: '#85bbe6', icon: '../assets/icons/series-probiotics-white.svg', href: 'Series-probio.dc.html', product: 'פוסטביוטיקה', image: '../assets/products/postbiotic.jpg' },
      pro: { name: 'הסדרה המקצועית', color: '#4d0333', icon: '../assets/icons/series-professional-white.svg', href: 'Series-pro.dc.html', product: 'רויוואל', image: '../assets/products/revival.jpg' }
    };
    const s = all[k] || all.vit;
    return {
      s: Object.assign({}, s, { isVit: k === 'vit', isPlants: k === 'plants', isProbio: k === 'probio', isPro: k === 'pro' }),
      productName: this.props.product || s.product,
      productImage: this.props.image || s.image
    };
  }
}
</script>
</body>
</html>
